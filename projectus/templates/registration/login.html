{% extends 'projectus/_base.html' %}

{% block titulo %}Login{% endblock %}

{% block content %}

<section class="form-page">

    <div class="card form-card">

        <h1 class="form-title">Login</h1>
        <p class="form-subtitle">Entre com seu usuário e senha.</p>

        <form method="POST" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Entrar</button>
        </form>

        <ul class="form-links">
            <li>Não possui uma conta? <a href="{% url 'register' %}">Cadastre-se</a></li>
            <li>Esqueceu sua senha? <a href="{% url 'password_reset' %}">Definir nova senha</a></li>
        </ul>

    </div>

</section>

{% endblock %}
