{% extends 'projectus/_base.html' %}

{% block content %}

<section class="form-page">

    <div class="card form-card">

        <h1 class="form-title">Recuperar senha</h1>
        <p class="form-subtitle">Informe seu e-mail cadastrado para receber o link de recuperação.</p>

        <form method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Enviar link</button>
        </form>

        <ul class="form-links">
            <li><a href="{% url 'login' %}">Voltar ao login</a></li>
        </ul>

    </div>

</section>

{% endblock %}
