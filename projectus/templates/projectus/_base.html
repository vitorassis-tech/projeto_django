{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ tag_title | default:'ProjectUs' }}</title>

    <!-- Fonte Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="{% static 'projectus/css/style.css' %}">
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">

            <a href="{% url 'home' %}" class="logo">
                <span class="logo-mark">P</span>
                <span>ProjectUs</span>
            </a>

            <nav class="nav">
                <a href="{% url 'home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}is-active{% endif %}">Início</a>

                {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="nav-user" title="Ver/editar perfil de {{ user.username }}">
                    <span class="avatar">{{ user.username|first|upper }}</span>
                    <span class="nav-user-name">Olá, {{ user.username }}!</span>
                </a>
                <form method="POST" action="{% url 'logout' %}" class="nav-form">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-ghost btn-sm">Sair</button>
                </form>
                {% else %}
                <a href="{% url 'register' %}" class="nav-link nav-hide-mobile">Criar conta</a>
                <a href="{% url 'login' %}" class="btn btn-sm">Entrar</a>
                {% endif %}
            </nav>

        </div>
    </header>

    <main class="container site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">&copy; 2026 ProjectUs</div>
    </footer>

</body>

</html>
