{% extends 'projectus/_base.html' %}
{% block content %}

<section class="form-page">

    <article class="card form-card">

        <h1 class="form-title">Criar conta</h1>
        <p class="form-subtitle">Preencha os dados abaixo para se cadastrar.</p>

        <form method="post" class="form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Cadastrar</button>
        </form>

        <ul class="form-links">
            <li>Já possui uma conta? <a href="{% url 'login' %}">Entrar</a></li>
        </ul>

    </article>

</section>

{% endblock %}
