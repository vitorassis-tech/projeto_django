{% extends 'projectus/_base.html' %}

{% block content %}

<section>

    <div class="page-header">
        <h1 class="page-title">Posts Recentes</h1>
        <p class="page-subtitle">{{ total }} posts.</p>
    </div>

    <div class="post-grid">

        {% for post in posts %}

        <article class="card post-card">
            <a href="{% url 'post_view' id=post.id %}" class="post-card-media">
                <img src="{{ post.thumbnail }}" alt="{{ post.title }}" loading="lazy">
            </a>
            <div class="post-card-body">
                <span class="meta">{{ post.created_at|date:"d/m/Y" }}</span>
                <h2 class="post-card-title"><a href="{% url 'post_view' id=post.id %}">{{ post.title }}</a></h2>
                <p class="post-card-summary">{{ post.summary }}</p>
                <a href="{% url 'post_view' id=post.id %}" class="link-arrow">Ler artigo <span>&rarr;</span></a>
            </div>
        </article>

        {% empty %}

        <p class="empty-state">Não achei nada.</p>

        {% endfor %}

    </div>

</section>

{% endblock %}
